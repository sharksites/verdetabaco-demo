<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#55823c">
<link rel="icon" href="assets/favicon.png">
<noscript><style>.rv{opacity:1!important;transform:none!important}</style></noscript>
<title>Verde Tabaco · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:600;line-height:1.1}
.wrap{max-width:1280px;margin:auto;padding:0 20px}
.btn{display:inline-block;padding:14px 28px;background:var(--green);color:#fff;border-radius:var(--r);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;transition:.25s}
.btn:hover{background:var(--gd);transform:translateY(-2px)}
.btn.light{background:#fff;color:var(--gd)}.btn.light:hover{background:var(--cream)}

/* barra superior + nav */
.announce{background:var(--gd);color:#fff;text-align:center;font-size:13px;padding:8px 12px;letter-spacing:.03em}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #0001}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.logo{font-family:var(--fh);font-size:25px;color:var(--green);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:50% 0 50% 0;background:var(--green);display:inline-block}
nav.main{display:flex;gap:6px;margin-left:24px}
.nav-item{position:relative}
.nav-item>button{padding:24px 12px;font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.drop{position:absolute;top:100%;left:0;min-width:210px;background:#fff;padding:14px;border-radius:var(--r);box-shadow:0 20px 40px #0002;opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
.nav-item:hover .drop{opacity:1;visibility:visible;transform:none}
.drop a{display:block;padding:8px 10px;border-radius:4px;font-size:14px}.drop a:hover{background:var(--cream);color:var(--green)}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:18px;position:relative;transition:.2s}
.ic:hover{background:var(--cream)}
.lang{font-size:12px;font-weight:600;border:1px solid #0003;border-radius:20px;padding:6px 10px;margin-right:6px}
.badge{position:absolute;top:2px;right:0;background:var(--tob);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;transition:.3s}
.badge.pop{transform:scale(1.5)}
.burger{display:none}
.searchbar{max-height:0;overflow:hidden;transition:.3s;background:#fff}
.searchbar.open{max-height:80px;border-bottom:1px solid #0001}
.searchbar input{width:100%;padding:20px 0;border:0;outline:0;font:inherit;font-size:18px}

/* hero */
.hero{position:relative;height:min(82vh,680px);min-height:520px;overflow:hidden;color:#fff}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity 1s;display:flex;align-items:center}
.slide.on{opacity:1;z-index:1}
.slide .wrap{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px;width:100%}
.slide .txt>*{opacity:0;transform:translateY(24px)}
.slide.on .txt>*{animation:up .8s forwards}
.slide.on .txt>*:nth-child(2){animation-delay:.12s}.slide.on .txt>*:nth-child(3){animation-delay:.24s}.slide.on .txt>*:nth-child(4){animation-delay:.36s}
@keyframes up{to{opacity:1;transform:none}}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:12px;opacity:.85;margin-bottom:14px}
.slide h1{font-size:clamp(34px,5vw,64px);margin-bottom:18px}
.slide p{font-size:18px;opacity:.9;margin-bottom:28px;max-width:440px}
.shoe{position:relative;display:grid;place-items:center}
.shoe::before{content:"";position:absolute;width:min(440px,90%);aspect-ratio:1;border-radius:50%;background:#ffffff1c}
.shoe svg,.shoe img{position:relative;width:min(480px,100%);border-radius:var(--r);transform:scale(.9) rotate(-4deg);transition:transform 6s}
.slide.on .shoe svg,.slide.on .shoe img{transform:scale(1.05) rotate(0)}
.dots{position:absolute;bottom:22px;left:0;right:0;z-index:3;display:flex;justify-content:center;gap:10px}
.dots button{width:34px;height:3px;background:#fff6;border-radius:2px;overflow:hidden}
.dots button.on{background:#fff}

/* secciones */
section{padding:72px 0}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px;gap:16px}
.head h2{font-size:clamp(26px,3.4vw,40px);max-width:620px}
.head a{font-size:14px;font-weight:600;border-bottom:2px solid var(--green);white-space:nowrap}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cat{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;color:#fff;display:flex;align-items:end;padding:24px}
.cat img,.cat>svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.cat:hover img,.cat:hover>svg{transform:scale(1.07)}
.cat::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(transparent 40%,#000a)}
.cat div{position:relative;z-index:1}.cat h3{font-size:30px}.cat span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{position:relative}
.ph{position:relative;aspect-ratio:1;background:var(--cream);border-radius:var(--r);overflow:hidden}
.ph img,.ph>svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform .6s}
.ph img+img,.ph>svg+svg{opacity:0}

.tag{position:absolute;top:10px;left:10px;z-index:2;background:var(--tob);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.08em}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:.2s}
.fav.on{color:#c0392b;transform:scale(1.15)}
.quick{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;padding:12px;background:var(--gd);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;transform:translateY(60px);transition:.3s}
@media(hover:hover){.card:hover .quick{transform:none}.card:hover .ph>svg:first-child,.card:hover .ph>img:first-child{opacity:0}.card:hover .ph img+img,.card:hover .ph>svg+svg{opacity:1}.card:hover .ph img,.card:hover .ph>svg{transform:scale(1.04)}}
@media(max-width:900px),(hover:none){.quick{transform:none;left:auto;right:8px;bottom:8px;width:40px;height:40px;padding:0;border-radius:50%;font-size:0}.quick::before{content:"+";font-size:26px;line-height:40px;display:block}}
.card h3{font-family:var(--fb);font-size:15px;font-weight:500;margin:14px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.price{color:var(--green);font-weight:600}

/* historia */
.story{background:var(--cream)}
.story .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.story h2{font-size:clamp(30px,4vw,48px);margin:12px 0 18px}
.story p{margin-bottom:26px;max-width:480px;color:#444}
.story .eyebrow{color:var(--tob)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mosaic svg{border-radius:var(--r);aspect-ratio:1;width:100%;background:#fff8}.mosaic svg:nth-child(2){margin-top:32px}.mosaic img{border-radius:var(--r);aspect-ratio:1;object-fit:cover;width:100%}
.mosaic img:nth-child(2){margin-top:32px}
.ben{padding:44px 0;border-bottom:1px solid #0001}
.ben .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.b{display:flex;gap:14px;align-items:center}.b i{font-style:normal;font-size:28px}.b b{display:block;font-size:15px}.b span{font-size:13px;color:#666}
.news{background:var(--gd);color:#fff;text-align:center}
.news h2{font-size:clamp(30px,4vw,46px);margin-bottom:10px}
.news form{display:flex;gap:10px;max-width:480px;margin:26px auto 0}
.news input{flex:1;padding:14px 16px;border-radius:var(--r);border:0;font:inherit;min-width:0}
footer{background:#1b2417;color:#fffa;padding:56px 0 28px;font-size:14px}
footer .cols{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:30px;margin-bottom:36px}
footer h4{color:#fff;margin-bottom:12px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
footer a{display:block;padding:4px 0}footer a:hover{color:#fff}
.copy{border-top:1px solid #fff2;padding-top:20px;font-size:12px}

/* carrito */
.veil{position:fixed;top:0;right:0;bottom:0;left:0;background:#0006;z-index:90;opacity:0;visibility:hidden;transition:.3s}
.veil.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:100;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{position:static;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.drawer h3{font-size:22px}
.ship{padding:0 20px 16px;font-size:13px}
.track{height:6px;background:var(--cream);border-radius:3px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;background:var(--green);width:0;transition:width .5s}
.items{flex:1;overflow:auto;padding:0 20px}
.empty{text-align:center;color:#777;margin-top:60px}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid #0001;font-size:14px;align-items:center}
.row svg{border-radius:4px;width:72px;height:72px;background:var(--cream)}.row img{border-radius:4px;aspect-ratio:1;object-fit:cover;width:72px}
.row button{font-size:20px;color:#999}
.foot{padding:20px;border-top:1px solid #0001}
.foot .tot{display:flex;justify-content:space-between;font-weight:600;margin-bottom:14px;font-size:17px}
.foot .btn{width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);background:#1b2417;color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;z-index:200;transition:.4s}
.toast{opacity:0;visibility:hidden}.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.menu-m{display:none}

/* reveal */
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s,transform .8s}
.rv.in,.noanim .rv{opacity:1;transform:none}

.shoe svg circle{display:none}.ic svg,.hrt{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fav.on .hrt,.rmfav .hrt{fill:currentColor}.rmfav{color:#c0392b}.ph{cursor:pointer}.sz{color:#777;font-size:12px}
.modal{position:fixed;left:50%;top:50%;width:min(880px,94%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;z-index:110;transform:translate(-50%,-46%);opacity:0;visibility:hidden;transition:.3s;display:grid;grid-template-columns:1fr 1fr}
.modal.on{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.mx{position:absolute;top:10px;right:10px;z-index:2;background:#fff}
.mg{background:var(--cream);padding:20px}.mv svg,.mv img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mt{display:flex;gap:10px;margin-top:10px}.mt button{width:64px;height:64px;border-radius:6px;border:2px solid transparent;background:#fff8;overflow:hidden}.mt button.on{border-color:var(--green)}.mt svg,.mt img{width:100%;height:100%}
.mi{padding:40px 30px 30px;display:flex;flex-direction:column;gap:12px}.mi h3{font-size:28px}.price.big{font-size:24px}.mi p{color:#555;font-size:14px}.mi small{color:#777}
.szl{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.szs{display:flex;flex-wrap:wrap;gap:8px}.szs button{min-width:48px;height:44px;border:1px solid #0003;border-radius:var(--r);font-weight:500}.szs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.mi .btn{margin-top:8px;text-align:center}
body{overflow-x:hidden;overflow-x:clip}body.lock{overflow:hidden}
:focus-visible{outline:2px solid var(--tob);outline-offset:2px}
.grid,.cats{scrollbar-width:none}.grid::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.badge.z{display:none}
.sres{position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:0 24px 30px #0002;max-height:60vh;overflow:auto}.sres:empty{display:none}
.sr{display:flex;gap:14px;align-items:center;padding:10px 20px;cursor:pointer;font-size:14px}.sr:hover{background:var(--cream)}
.sr svg,.sr img{width:52px;height:52px;border-radius:4px;background:var(--cream);object-fit:cover;flex:none}
.qty{display:inline-flex;align-items:center;gap:10px;margin-top:6px}
.row .qty button{width:28px;height:28px;border:1px solid #0003;border-radius:50%;font-size:16px;color:var(--ink)}
.row .qty button.txt{width:auto;padding:0 14px;border-radius:14px;font-size:12px;background:var(--green);color:#fff;border:0}
.favmode .foot,.favmode .ship{display:none}
.mh{display:flex;justify-content:space-between;align-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.slide .txt>*{opacity:1!important;transform:none!important}}
/* móvil */
@media(max-width:900px){
 nav.main{display:none}.burger{display:grid}
 .menu-m{display:block;position:fixed;top:0;left:0;bottom:0;width:min(320px,86%);background:#fff;z-index:100;transform:translateX(-100%);transition:.4s;padding:20px;overflow:auto}
 .menu-m.on{transform:none}
 .menu-m h4{font-family:var(--fh);font-size:22px;margin:18px 0 6px;color:var(--green)}.menu-m a{display:block;padding:8px 0;font-size:15px}
 .slide .wrap{grid-template-columns:1fr;text-align:center;gap:0}
 .slide .txt{order:2}.slide p{margin-inline:auto;font-size:16px}.shoe{order:1}.shoe img,.shoe svg{width:62%}
 .hero{height:auto;min-height:620px}.slide{padding:30px 0 60px}
 section{padding:48px 0}
 .cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
 .cat{scroll-snap-align:start}
 .grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:62%;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin-right:-20px;padding-right:20px}
 .card{scroll-snap-align:start}.card h3{min-height:2.9em}.modal{grid-template-columns:1fr;top:auto;bottom:0;left:0;width:100%;max-height:90vh;border-radius:16px 16px 0 0;transform:translateY(100%)}.modal.on{transform:none}.mi{padding:22px 20px 28px}.mg{padding:14px}.mv svg{max-height:40vh}
 .story .wrap{grid-template-columns:1fr;gap:30px}
 .ben .wrap{grid-template-columns:1fr 1fr}
 footer .cols{grid-template-columns:1fr 1fr}
 .head{flex-direction:column;align-items:start}
 .tools .lang{display:none}.acct{display:none}.bar{padding:0 12px;gap:2px}.logo{font-size:20px;min-width:0;margin-right:auto}.logo i{width:20px;height:20px}.tools{margin-left:0}.ic{width:38px;height:38px}
}

/* logo */
.logo img{height:34px;width:auto;display:block}.logo .lf{display:flex;align-items:center;gap:8px}.logo .lf[hidden],.logo img[hidden]{display:none}.flogo img.inv{filter:brightness(0) invert(1)}
.flogo img{height:34px;width:auto;margin-bottom:14px;display:block}.flogo span{font-family:var(--fh);font-size:24px;color:#fff;display:block;margin-bottom:12px}.flogo [hidden]{display:none}
/* sellos */
.seals{position:absolute;left:10px;top:46px;z-index:3;display:flex;flex-direction:column;gap:6px}.seals.nt{top:10px}
.seal-b{display:block;width:52px;height:52px;border-radius:50%;padding:0;transition:transform .25s;box-shadow:0 2px 8px #0003}
.seal-b:hover{transform:scale(1.12) rotate(-6deg)}.seal-b svg,.spill svg,.sealcard svg,.vh svg{display:block;width:100%;height:100%}
.sealgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sealcard{display:flex;gap:24px;align-items:center;padding:28px;border:1px solid #0001;border-radius:var(--r);background:#fff;transition:.3s}
.sealcard:hover{transform:translateY(-4px);box-shadow:0 16px 40px #0001;border-color:var(--green)}
.sealcard svg{width:116px;height:116px;flex:none}.sealcard h3{font-size:24px;margin-bottom:6px}.sealcard p{color:#555;font-size:14px;margin-bottom:10px}.sealcard .more{font-weight:600;font-size:14px;color:var(--green)}
.spills{display:flex;flex-direction:column;gap:8px}
.spill{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px 8px 8px;border:1px solid #0002;border-radius:44px;transition:.2s}
.spill:hover{border-color:var(--green);background:var(--cream)}.spill svg{width:42px;height:42px;flex:none}.spill b{display:block;font-size:13px}.spill small{display:block;color:#666;font-size:12px}
/* vista de sello */
#view{display:none}body.inview #view{display:block}body.inview #home{display:none}
.vh{background:var(--cream);padding:48px 0 56px;border-bottom:4px solid var(--green)}
.vh .wrap{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center}.vh .sv{width:190px;height:190px}
.vh h1{font-size:clamp(32px,5vw,56px);margin:8px 0 14px}.vh p{max-width:660px;font-size:17px;color:#444}
.back{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:600;margin-bottom:22px;color:var(--green)}.back:hover{text-decoration:underline}
.vb{padding:56px 0 72px}.vb h2{font-size:clamp(24px,3vw,34px);margin-bottom:22px}
.pts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.pt{padding:22px;border:1px solid #0001;border-radius:var(--r);display:flex;gap:14px}
.pt i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center}.pt i svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pt b{display:block;margin-bottom:4px}.pt span{color:#555;font-size:14px}
.stp{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stp div{background:var(--cream);padding:22px;border-radius:var(--r);font-size:14px}
.stp div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:600;margin-bottom:12px}
.note{background:var(--cream);border-left:4px solid var(--green);padding:24px;border-radius:var(--r);margin:48px 0}.note p{margin:6px 0 16px;color:#444}
.vb .head{margin:0 0 24px}
/* compatibilidad: navegadores sin aspect-ratio */
@supports not (aspect-ratio:1/1){.ph{min-height:240px}.cat{min-height:380px}.mv svg,.mv img{min-height:280px}.mosaic svg{min-height:140px}}
/* áreas seguras (iPhone) */
.drawer .foot{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}.toast{bottom:calc(26px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){
 .seal-b{width:44px;height:44px}.sealgrid{grid-template-columns:1fr}.sealcard{padding:20px;gap:16px}.sealcard svg{width:88px;height:88px}
 .logo img{height:26px}.flogo{grid-column:1/-1}
 .vh{padding:32px 0 40px}.vh .wrap{grid-template-columns:1fr;gap:20px}.vh .sv{width:116px;height:116px}
 .pts{grid-template-columns:1fr}.stp{grid-template-columns:1fr 1fr}.vb{padding:40px 0 56px}
 .mi{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:380px){.logo img{height:22px}.stp{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="announce" id="announce"></div>
<header>
  <div class="wrap bar">
    <button class="ic burger" id="burger" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a href="#" class="logo" aria-label="verdetabaco"><img id="logoimg" alt="verdetabaco" hidden><span class="lf" id="lf" hidden><i id="logoi"></i><span id="brand"></span></span></a>
    <nav class="main" id="nav"></nav>
    <div class="tools">
      <button class="lang" id="lang">EN</button>
      <button class="ic" id="sbtn" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ic acct" data-demo aria-label="Cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>

  const d = x.dataset;
  if (d.a || d.o) openQuick(d.a || d.o);
  else if (d.f) { favs.has(d.f) ? favs.delete(d.f) : favs.add(d.f); syncFav(d.f); renderCart(); }
  else if (d.rm) { delete cart[d.rm]; renderCart(); }
  else if (d.q) { cart[d.q] = (cart[d.q] || 0) + +d.n; if (cart[d.q] <= 0) delete cart[d.q]; renderCart(); }
  else if (d.sr) { $("sres").innerHTML = ""; $("sbar").classList.remove("open"); openQuick(d.sr); }
  else if (d.seal) { closeAll(); location.hash = "sello-" + d.seal; }
  else if (d.sz) { qsize = d.sz; renderModal(); }
  else if (d.qv) { qview = d.qv; renderModal(); }
  else if (d.add !== undefined) { if (!qsize) return toast(T().pickSize); addCart(qid, qsize); closeAll(); openCart(true, "cart"); toast(T().added); }
  else if (d.close !== undefined) closeAll();
  else if (d.lang !== undefined) $("lang").click();
  else if (d.s) { go(+d.s, true); }
  else { e.preventDefault(); if (x.id !== "chk") closeAll(); toast(T().demo); }
});
$("cbtn").onclick = () => openCart(true, "cart"); $("cx").onclick = $("veil").onclick = closeAll;
$("burger").onclick = () => { $("mm").classList.add("on"); $("veil").classList.add("on"); lock(); };
$("sbtn").onclick = () => { $("sbar").classList.toggle("open"); $("sres").innerHTML = ""; if ($("sbar").classList.contains("open")) $("sinp").focus(); };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
$("sinp").oninput = e => { const q = norm(e.target.value.trim()); $("sres").innerHTML = q ? (Object.values(all).filter(i => norm(i.name).includes(q)).slice(0, 6).map(i => `<div class="sr" data-sr="${i.id}">${pic(i)}<div>${i.name}<br><b class="price">${money(i.price)}</b></div></div>`).join("") || `<p class="empty" style="margin:0;padding:24px">${T().noResults}</p>`) : ""; };
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeAll(); $("sbar").classList.remove("open"); $("sres").innerHTML = ""; } });
$("favbtn").onclick = () => openCart(true, "favs");
$("lang").onclick = () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("vt-lang", lang); } catch (e) {} render(); };
$("nf").onsubmit = e => { e.preventDefault(); toast("✓"); $("ni").value = ""; };

// slider
let cur = 0, timer;
function go(i, manual) {
  cur = (i + C.hero.length) % C.hero.length;
  document.querySelectorAll(".slide").forEach((s, k) => s.classList.toggle("on", k === cur));
  document.querySelectorAll(".dots button").forEach((s, k) => s.classList.toggle("on", k === cur));
  if (manual) auto();
}
function auto() { clearInterval(timer); if (C.features.heroAutoplay) timer = setInterval(() => go(cur + 1), C.features.heroInterval); }

let tx = 0;
$("hero").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
$("hero").addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) go(cur + (d < 0 ? 1 : -1), true); }, { passive: true });

// reveal on scroll
const io = !window.IntersectionObserver ? null : new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
function observe() { document.querySelectorAll(".rv:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in")); }

// logo opcional (assets/logo.png) y manejo de imágenes faltantes
// logo: prueba varias rutas/nombres comunes; si ninguna existe, muestra el nombre en texto
const asList = v => [].concat(v || []);
const LOGO = asList(C.brand.logo).concat(["assets/logo.png", "assets/Logo.png", "assets/LOGO.png", "assets/logo.PNG", "assets/LOGO_VT-opt.png", "logo.png", "LOGO_VT-opt.png"]);
const LOGOW = asList(C.brand.logoWhite).concat(["assets/logo-blanco.png", "assets/Logo-blanco.png", "assets/logo_blanco.png", "logo-blanco.png"]);
function probe(list) {
  return new Promise(res => { let k = 0; const t = new Image(); const nx = () => (k < list.length ? (t.src = list[k++]) : res(null)); t.onload = () => res(t.src); t.onerror = nx; nx(); });
}
probe(LOGO).then(main => {
  const li = $("logoimg"), fl = $("flogo");
  if (main) { li.src = main; li.hidden = false; } else { $("lf").hidden = false; }
  return probe(LOGOW).then(w => {
    if (w) { fl.src = w; fl.hidden = false; }
    else if (main) { fl.classList.add("inv"); fl.src = main; fl.hidden = false; }   // sin logo blanco: invierte el verde
    else { $("fbrand").hidden = false; }
  });
});
document.addEventListener("error", e => { if (e.target.tagName === "IMG" && !/^(logoimg|flogo)$/.test(e.target.id)) e.target.style.visibility = "hidden"; }, true);

window.addEventListener("hashchange", route);
render(); auto(); route();
</script>
